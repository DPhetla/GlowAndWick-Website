<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send an Enquiry - Glow & Wick</title>
  <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>

  <!-- Navigation Menu -->
  <nav class="navbar">
    <div class="logo">🕯️ Glow & Wick</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="services.html">Our Services</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="Enquiry.html">Enquiry</a></li>
    </ul>
  </nav>

  <main class="content-container">
    <h1 style="text-align: center;">Product Enquiry</h1>
    <p style="text-align: center; margin-bottom: 30px;">Fill out this form and our candle consultants will get back to you shortly.</p>

    <!-- Interactive Client Input Form -->
    <form class="enquiry-form" action="#" method="POST">
      <div class="form-group">
        <label for="name">Your Name:</label>
        <input type="text" id="name" name="name" required placeholder="Enter your full name">
      </div>

      <div class="form-group">
        <label for="email">Your Email Address:</label>
        <input type="email" id="email" name="email" required placeholder="name@example.com">
      </div>

      <div class="form-group">
        <label for="product">Select Candle Design:</label>
        <select id="product" name="product" required>
          <option value="">-- Choose an option --</option>
          <option value="sculpture">Paar-Skulptur Kerze</option>
          <option value="wedding">Wedding Candle</option>
          <option value="butterfly">Butterfly Wax Mold Candle</option>
          <option value="custom">Other Custom Order</option>
        </select>
      </div>

      <div class="form-group">
        <label for="message">Your Message or Custom Requests:</label>
        <textarea id="message" name="message" rows="5" required placeholder="Tell us more about your ideal candle layout request..."></textarea>
      </div>

      <button type="submit" class="cta-button" style="width: 100%; border: none; cursor: pointer; margin-top: 10px;">Submit Enquiry</button>
    </form>
  </main>

</body>
</html>
